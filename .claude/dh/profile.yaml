# Project profile: go-audit (shared Go audit library: event builder, router, HTTP/Redis/file writers)
# Copied from the get-native-auth profile (same Jira project, AIN) by dh-kit-setup; change it here via a PR.

project:
  name: go-audit
  short: audit-lib
  repo: git@github.com:turnkeystaffing/go-audit.git   # local clones may use an ssh host alias
  local_path: ~/work/ai-workspace/go/src/go-audit

tracker:
  type: jira-cloud
  site: getnative.atlassian.net   # must be dh-mcp's JIRA_SITE
  project_key: AIN              # shared project; tickets for this repo carry the scope label below
  mcp: dh-mcp                # server "dh" (dh plugin): every tool takes repo = scm.workspace/scm.repo_slug; this file, as merged, is the scope (D-104)
  scope_label: go-audit         # REQUIRED on every ticket for this repo; dh-task-create adds it, dh-task-start checks it
  issue_types: [Epic, Task]
  # Transition NAMES (AIN workflow, as in the get-native-auth profile, verified there 2026-09-25). Resolve IDs at runtime; never hard-code IDs.
  # Workflow: To Do -> In Progress -> In Review -> TEST -> Done
  transitions:
    start: In Progress
    review: In Review
    done: Done
    # "TEST" exists (QA stage). The agent never moves tickets to TEST; humans do.
  labels:
    agent_ready: dh-ready       # system label, fixed by the kit, do not change (D-57)
    agent_created: dh           # system label, fixed by the kit, do not change (D-57)
    layers: {BE: backend}       # Go library, backend only (team label)
    grooming: needs-grooming    # team label; set when the criteria need the team, removed at start (D-57)
  create_in: backlog            # where dh-task-create puts new tickets (D-74)
  create_fields:                # selects to ask for at create where Jira has them as optional; required ones are always asked (D-102)
    - name: Reporting Work Type   # same AIN screen as get-native-auth; re-check with "update the dh kit here" after merge
      hint: "new work or a new feature: Development; a change to an existing feature: Support"
  sprints:
    on_start: add               # add to the active sprint when moving to In Progress (add | ask | none, D-74)

roadmap: {require_link: warn}   # switches the roadmap on (D-113); the values come from the home repo (delivery-hub) via jira_get_roadmap; never an empty "roadmap:" (dh/conventions/roadmap.md §2)

scm:
  type: github
  workspace: turnkeystaffing    # GitHub owner
  repo_slug: go-audit
  mcp: dh-mcp                # server "dh" (dh plugin): github_pr_* tools (no merge/approve/decline/delete exist)
  base_branch: master           # the only long-lived branch; releases are tags (v0.x.y)
  protected: [master]
  branch_patterns:
    task: "task/{key}-{slug}"
    bug: "bugfix/{key}-{slug}"

workflows:
  create: dh-task-create
  implement: dh-tdd
  diagnose: dh-diagnose

docs:                           # used as the domain glossary until a CONTEXT.md exists
  - CLAUDE.md
  - AGENTS.md
  # The audit service's docs describe the wire contract this library sends to:
  # get-native-platform docs/audit/SDK.md and docs/audit/SECURITY.md

# dh-task-verify runs every key below on every task; only integration is conditional (evidence.md rule 4).
# Every other key must end on its own and leave `git status --porcelain` empty (ignored build output is fine): no dev servers, watchers, migrations or fix-mode formatters.
# -mod=readonly: /vendor is git-ignored; a stale local copy must not break the run, and go.mod/go.sum must not be rewritten.
commands:                       # run from the repo root (Go only, no frontend)
  backend:
    unit: "go test -mod=readonly ./... -count=1 -shuffle=on"
    integration: "go test -mod=readonly ./... -count=1 -shuffle=on -tags=integration"   # needs Docker (Redis testcontainers)
    lint: "go vet -mod=readonly ./..."   # no .golangci.yml yet; golangci-lint defaults report 34 existing issues (errcheck 31, unused 2, staticcheck 1)

ci:
  provider: none                # no CI config in the repo
  enforced: false               # evidence is local (dh plugin: dh/conventions/evidence.md)

agents:
  allowed: [claude, codex]
  never:                        # actions no agent may take, whatever the prompt says
    - merge or approve pull requests
    - push to protected branches or force-push
    - delete Jira issues, releases or branches
    - commit secrets, .env files, certs, keys or personal notes
    - move Jira tickets to TEST (humans do)
